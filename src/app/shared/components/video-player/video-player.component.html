<div class="video-player-shell">
  @if (src) {
    <video
      #videoElement
      class="video-player"
      [src]="src"
      [poster]="poster || null"
      [attr.autoplay]="''"
      [attr.muted]="muted ? '' : null"
      [attr.loop]="loop ? '' : null"
      [attr.playsinline]="''"
      [attr.disablepictureinpicture]="''"
      [attr.disableremoteplayback]="''"
      [controls]="true"
      preload="auto"
      tabindex="-1"
      (canplay)="onCanPlay()"
      (error)="onError()"
      (ended)="onEnded()"
    ></video>
  }

  @if (!src || isLoading || hasError) {
    <div class="video-player-state" [class.video-player-state--error]="hasError">
      @if (hasError) {
        <span>{{ errorText }}</span>
      } @else {
        <span class="video-player-spinner" aria-hidden="true"></span>
        <span>{{ loadingText }}</span>
      }
    </div>
  }
</div>
