<app-home-button></app-home-button>

<div
  class="button-container"
  [ngStyle]="{
    'background-image': 'url(assets/images/background.jpg)',
  }"
>
  <!-- Button 1: C.P Vietnam Introduction -->
  <button class="button__primary" (click)="onNavigateIntroduction()">
    <span class="btn-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </span>
    <span class="btn-label">
      <span class="btn-title">{{ 'DASHBOARD.BTN1_TITLE' | translate }}</span>
      <span class="btn-sub">{{ 'DASHBOARD.BTN1_SUB' | translate }}</span>
    </span>
  </button>

  <!-- Button 2: Our Sustainability Strategy -->
  <button class="button__primary" (click)="onNavigateStrategy()">
    <span class="btn-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8 6 4 8 4 13a8 8 0 0 0 16 0c0-5-4-7-8-11z"/>
        <path d="M12 14v4"/>
      </svg>
    </span>
    <span class="btn-label">
      <span class="btn-title">{{ 'DASHBOARD.BTN2_TITLE' | translate }}</span>
      <span class="btn-sub">{{ 'DASHBOARD.BTN2_SUB' | translate }}</span>
    </span>
  </button>

  <!-- Button 3: Sustainovation in Business -->
  <button class="button__primary" (click)="onNavigateBusiness()">
    <span class="btn-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </span>
    <span class="btn-label">
      <span class="btn-title">{{ 'DASHBOARD.BTN3_TITLE' | translate }}</span>
      <span class="btn-sub">{{ 'DASHBOARD.BTN3_SUB' | translate }}</span>
    </span>
  </button>

  <!-- QR code -->
  <div class="qr-section">
    <qrcode
      [qrdata]="'https://www.cp.com.vn/'"
      [width]="qrWidth"
      [errorCorrectionLevel]="'M'"
      [colorDark]="'#1a1a1a'"
      [colorLight]="'#ffffff'"
      [margin]="2">
    </qrcode>
    <p class="qr-label">www.cp.com.vn</p>
  </div>
</div>
