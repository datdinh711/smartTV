<div class="vdo-wrapper">
  <app-video-player
    [src]="videoSrc"
    [muted]="false"
    [loop]="false"
    (videoEnded)="onVideoEnded()"
  ></app-video-player>
  <app-navigation-button
    [isNext]="false"
    [destPath]="backPath"
  ></app-navigation-button>
  <app-navigation-button [destPath]="nextPath"></app-navigation-button>
  <div class="vdo-content"></div>
</div>
