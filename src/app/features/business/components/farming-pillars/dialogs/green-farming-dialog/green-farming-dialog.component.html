<div class="dialog-overlay" (click)="closeDialog()"></div>

<div class="dialog-content" (animationend)="onContentAnimationEnd($event)">
  <div class="gf-dialog">

    <div class="dialog-header">
      <span></span>
      <h2>{{ 'BUSINESS.GREEN_FARMING_CIRCULAR.CARD3_TITLE' | translate }}</h2>
      <button class="close-btn" (click)="closeDialog()" aria-label="Đóng">✕</button>
    </div>

    <div class="dialog-body">
      <div class="dialog-img-wrap">
        <img src="assets/images/green-farming-card.jpg"
          [attr.alt]="'BUSINESS.GREEN_FARMING_CIRCULAR.CARD3_TITLE' | translate" />
      </div>
      <p class="dialog-description">
        {{ 'BUSINESS.GREEN_FARMING_DIALOG.DESC' | translate }}
      </p>
    </div>

  </div>
</div>
