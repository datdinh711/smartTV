<div class="welcome-screen">

  <!-- Floating background shapes -->
  <div class="bubble bubble--1" aria-hidden="true"></div>
  <div class="bubble bubble--2" aria-hidden="true"></div>
  <div class="bubble bubble--3" aria-hidden="true"></div>

  <!-- Language switch — top right -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button
      class="lang-btn"
      [class.lang-btn--active]="currentLang === 'en'"
      (click)="switchLanguage('en')"
      type="button"
      aria-label="Switch to English">
      EN
    </button>
    <button
      class="lang-btn"
      [class.lang-btn--active]="currentLang === 'vi'"
      (click)="switchLanguage('vi')"
      type="button"
      aria-label="Chuyển sang Tiếng Việt">
      VI
    </button>
  </div>

  <!-- Glass card -->
  <div class="glass-card">

    <!-- Top shimmer bar -->
    <div class="card-shimmer" aria-hidden="true"></div>

    <!-- CP badge -->
    <div class="cp-badge" aria-hidden="true">
      <img src="assets/images/cp_logo.webp" alt="CP Logo">
    </div>

    <!-- Eyebrow -->
    <p class="eyebrow">{{ 'WELCOME.EYEBROW' | translate }}</p>

    <!-- Title -->
    <h1 class="title">
      @if (currentLang === 'vi') {
        <span class="title__corp">{{ 'WELCOME.CORP' | translate }}</span>
        <span class="title__cp">C.P.</span>
        <span class="title__vietnam">{{ 'WELCOME.VIETNAM' | translate }}</span>
      } @else {
        <span class="title__cp">C.P.</span>
        <span class="title__vietnam">{{ 'WELCOME.VIETNAM' | translate }}</span>
        <span class="title__corp">{{ 'WELCOME.CORP' | translate }}</span>
      }
    </h1>

    <!-- Divider -->
    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <span class="divider__dot"></span>
      <span class="divider__line"></span>
    </div>

    <!-- Tagline -->
    <p class="tagline">{{ 'WELCOME.TAGLINE' | translate }}</p>

    <!-- CTA -->
    <button class="cta-btn glow-pulse" (click)="onNavigateDashboard()" type="button">
      <span class="cta-btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </span>
      <span class="cta-btn__text">{{ 'WELCOME.CTA' | translate }}</span>
      <span class="cta-btn__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12,5 19,12 12,19"/>
        </svg>
      </span>
    </button>

    <!-- Footer dots -->
    <div class="card-footer" aria-hidden="true">
      <span class="footer__dot"></span>
      <span class="footer__dot footer__dot--active"></span>
      <span class="footer__dot"></span>
    </div>

  </div>

</div>
