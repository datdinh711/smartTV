<div class="welcome-screen">

  <!-- Floating background shapes -->
  <div class="bubble bubble--1" aria-hidden="true"></div>
  <div class="bubble bubble--2" aria-hidden="true"></div>
  <div class="bubble bubble--3" aria-hidden="true"></div>

  <!-- Glass card -->
  <div class="glass-card">

    <!-- Top shimmer bar -->
    <div class="card-shimmer" aria-hidden="true"></div>

    <!-- CP badge -->
    <div class="cp-badge" aria-hidden="true">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="34" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="26" fill="rgba(255,255,255,0.18)"
                stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <text x="36" y="44" text-anchor="middle"
              font-family="Arial Black, sans-serif"
              font-size="20" font-weight="900" fill="white" letter-spacing="1">CP</text>
      </svg>
    </div>

    <!-- Eyebrow -->
    <p class="eyebrow">Welcome to</p>

    <!-- Title -->
    <h1 class="title">
      <span class="title__cp">C.P.</span>
      <span class="title__vietnam">Vietnam</span>
      <span class="title__corp">Corporation</span>
    </h1>

    <!-- Divider -->
    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <span class="divider__dot"></span>
      <span class="divider__line"></span>
    </div>

    <!-- Tagline -->
    <p class="tagline">
      Kiến tạo tương lai bền vững
    </p>

    <!-- CTA -->
    <button class="cta-btn glow-pulse" (click)="onNavigateDashboard()" type="button">
      <span class="cta-btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </span>
      <span class="cta-btn__text">Go to Dashboard</span>
      <span class="cta-btn__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12,5 19,12 12,19"/>
        </svg>
      </span>
    </button>

    <!-- Footer dots -->
    <div class="card-footer" aria-hidden="true">
      <span class="footer__dot"></span>
      <span class="footer__dot footer__dot--active"></span>
      <span class="footer__dot"></span>
    </div>

  </div>

</div>
